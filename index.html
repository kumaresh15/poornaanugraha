<!-- Script Logic -->
    <script>
        let bookingData = {
            date: '',
            hall: '',
            decor: '',
            name: '',
            purpose: ''
        };

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyzIq36o27t6IZZ_gy8bBD-3ob29Q2l245Fm1yiXnEj_6Xy9ElaeWmfh4KOwPdMQlnH/exec';
        let bookedDatesList = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        async function fetchBookedDatesAndRender() {
            try {
                if (APPS_SCRIPT_URL) {
                    const response = await fetch(APPS_SCRIPT_URL);
                    bookedDatesList = await response.json();
                }
            } catch (error) {
                console.error('Could not load availability', error);
            }
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearLabel = document.getElementById('calendar-month-year');
            if (!grid || !monthYearLabel) return;
            
            grid.innerHTML = '';

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthYearLabel.innerText = `${monthNames[currentMonth]} ${currentYear}`;

            // Blank padding for days before the 1st of the month
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                grid.appendChild(emptyCell);
            }

            // Render days of the month
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'calendar-day p-3 rounded-2xl text-sm font-bold flex items-center justify-center h-12 shadow-xs';

                const isBooked = bookedDatesList.includes(dateStr);
                const isSelected = bookingData.date === dateStr;

                if (isSelected) {
                    cell.classList.add('bg-amber-600', 'text-white', 'ring-2', 'ring-amber-800');
                    cell.innerText = day;
                } else if (isBooked) {
                    cell.classList.add('bg-rose-500', 'text-white', 'cursor-not-allowed', 'opacity-90');
                    cell.innerText = day;
                    cell.title = 'Already Booked';
                    cell.disabled = true;
                } else {
                    cell.classList.add('bg-emerald-500', 'hover:bg-emerald-600', 'text-white', 'cursor-pointer');
                    cell.innerText = day;
                    cell.onclick = () => selectDate(dateStr);
                }

                grid.appendChild(cell);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function selectDate(dateStr) {
            bookingData.date = dateStr;
            document.getElementById('selected-date-display').innerText = `Selected Date: ${dateStr}`;
            renderCalendar();
        }

        window.addEventListener('DOMContentLoaded', fetchBookedDatesAndRender);

        function nextStep(step) {
            if (step === 2) {
                if (!bookingData.date) {
                    alert('Please select an available green date from the calendar.');
                    return;
                }
            }
            if (step === 3) {
                const radios = document.getElementsByName('hall');
                let selected = false;
                for (let r of radios) {
                    if (r.checked) {
                        bookingData.hall = r.value;
                        selected = true;
                        break;
                    }
                }
                if (!selected && !bookingData.hall) {
                    alert('Please select a hall option.');
                    return;
                }
            }
            if (step === 4) {
                if (!bookingData.decor) {
                    alert('Please select a stage decor option or choose to skip.');
                    return;
                }
            }
            if (step === 5) {
                const nameInput = document.getElementById('cust-name').value.trim();
                const purposeInput = document.getElementById('cust-purpose').value.trim();

                if (!nameInput || !purposeInput) {
                    alert('Please enter your name and function purpose.');
                    return;
                }

                bookingData.name = nameInput;
                bookingData.purpose = purposeInput;
            }
            if (step === 6) {
                const message = `Hello Sri Poorna Anugraha Mini Hall!\n\nI would like to book the venue with the following details:\n- Name: ${bookingData.name}\n- Purpose: ${bookingData.purpose}\n- Date: ${bookingData.date}\n- Hall: ${bookingData.hall}\n- Decor: ${bookingData.decor}\n\nPlease confirm availability.`;
                const encoded = encodeURIComponent(message);
                document.getElementById('whatsapp-link').href = `https://wa.me/919442071354?text=${encoded}`;
            }

            showStep(step);
        }

        function prevStep(step) {
            showStep(step);
        }

        function selectHall(hallName) {
            bookingData.hall = hallName;
            const radios = document.getElementsByName('hall');
            for (let r of radios) {
                if (r.value === hallName || hallName.includes(r.value)) {
                    r.checked = true;
                }
            }
        }

        function selectDecor(decorName) {
            bookingData.decor = decorName;
        }

        function updateReviewSummary() {
            document.getElementById('review-name').innerText = bookingData.name || '-';
            document.getElementById('review-purpose').innerText = bookingData.purpose || '-';
            document.getElementById('review-date').innerText = bookingData.date || '-';
            document.getElementById('review-hall').innerText = bookingData.hall || '-';
            document.getElementById('review-decor').innerText = bookingData.decor || '-';
        }

        function showStep(step) {
            for (let i = 1; i <= 6; i++) {
                const stepEl = document.getElementById(`step-${i}`);
                if (stepEl) {
                    stepEl.classList.add('hidden');
                }
                const indicator = document.getElementById(`indicator-${i}`);
                if (indicator) {
                    indicator.classList.remove('text-amber-800', 'bg-amber-100', 'font-bold');
                }
            }
            document.getElementById(`step-${step}`).classList.remove('hidden');
            const activeIndicator = document.getElementById(`indicator-${step}`);
            if (activeIndicator) {
                activeIndicator.classList.add('text-amber-800', 'bg-amber-100', 'font-bold');
            }

            if (step === 5) {
                updateReviewSummary();
            }
        }
    </script>
